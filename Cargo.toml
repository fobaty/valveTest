[package]
name = "throttle-valve-controller"
version = "0.1.0"
edition = "2021"
description = "Universal stepper-driven throttle valve controller with Wi-Fi AP and web UI (RP2350 / Pico 2W)"

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-rp = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl", "defmt", "unstable-pac", "executor-thread", "executor-interrupt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-net = { version = "0.9", features = ["defmt", "tcp", "medium-ethernet", "proto-ipv4", "dns"] }
cyw43 = { version = "0.7", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10", features = ["defmt"] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7"
static_cell = "2.1"
futures = { version = "0.3", default-features = false, features = ["async-await"] }
embedded-io-async = { version = "0.7", features = ["defmt"] }
heapless = "0.9"

[profile.dev]
opt-level = 3
debug = true

[profile.release]
opt-level = "s"
debug = true
lto = "thin"
codegen-units = 1
